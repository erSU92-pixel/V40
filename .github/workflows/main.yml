name: Apex Predator Bot
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  apex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests websocket-client
      
      # --- INI ADALAH OBAT OTOMATIS UNTUK SPASI YANG BERANTAKAN ---
      - name: Rapikan Spasi Otomatis
        run: |
          python -c "
          import re
          lines = open('main.py', 'r').readlines()
          fixed = [l.lstrip() if re.match(r'^\s+(def |class |import |from |@|if __name__)', l) else l for l in lines]
          open('main.py', 'w').writelines(fixed)
          "
      # ------------------------------------------------------------
      
      - run: python main.py run
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
