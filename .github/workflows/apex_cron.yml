name: Apex Predator Bot v8.0

on:
  # Berjalan otomatis setiap 15 menit di hari kerja (Senin - Jumat, Waktu UTC)
  schedule:
    - cron: '*/15 6-17 * * 1-5'
  
  # Memungkinkan bot dijalankan secara manual dari tab "Actions" di GitHub
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests>=2.28.0 pandas>=1.3.0 numpy>=1.20.0

      - name: Run Apex Bot Engine v8.0
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          APEX_ACCOUNT_TYPE: ${{ secrets.APEX_ACCOUNT_TYPE }}
          APEX_ENABLE_DERIV: "false"  # Mematikan Deriv WebSocket untuk mencegah Error 520 Cloudflare di server GitHub
        run: |
          python apex.py run
