name: APEX Signal Bot

on:
  schedule:
    - cron: '*/5 7-10 * * 1-5'
    - cron: '*/5 12-16 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apex-signal
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure state files exist
        run: |
          [ -f signal_state.json ] || echo '{}' > signal_state.json
          [ -f xauusd_apex_report.json ] || echo '[]' > xauusd_apex_report.json
          [ -f trade_journal.json ] || echo '[]' > trade_journal.json

      - name: Run APEX bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          APEX_ENABLE_DERIV: '0'
          APEX_ACCOUNT_BALANCE_USD: ${{ vars.APEX_ACCOUNT_BALANCE_USD || '10000' }}
          APEX_RISK_PERCENTAGE: ${{ vars.APEX_RISK_PERCENTAGE || '1.0' }}
          APEX_MAX_DAILY_SIGNALS: ${{ vars.APEX_MAX_DAILY_SIGNALS || '5' }}
          APEX_SCORE_THRESHOLD: ${{ vars.APEX_SCORE_THRESHOLD || '8' }}
        run: python run.py

      - name: Commit state files
        uses: stefanzweifel/git-auto-commit-action@v5
        continue-on-error: true
        with:
          commit_message: "chore(state): auto-update [skip ci]"
          file_pattern: "signal_state.json xauusd_apex_report.json trade_journal.json"
          skip_dirty_check: false
          skip_fetch: true
          commit_user_name: "apex-bot"
          commit_user_email: "apex-bot@users.noreply.github.com"
          commit_author: "apex-bot <apex-bot@users.noreply.github.com>"
